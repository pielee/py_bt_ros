scenario: scenarios.final_project

agent:
  namespaces: "/limo" 
  behavior_tree_xml: "default_bt.xml"

bt_runner:
  bt_tick_rate: 10.0 
  bt_visualiser:
    enabled: True
    screen_width: 600 
    screen_height: 600 
  profiling_mode: False

# ... (기존 내용 아래에 추가)

qr_system:
  # LIMO Pro 카메라 토픽 (보통 기본값이지만 확인 필요)
  camera_topic: "/camera/color/image_raw"
  
  # 성능 최적화를 위한 리사이즈 (LIMO Pro CPU 부하 감소용)
  process_width: 640

  # 지역별 키워드
  areas:
    SEOUL: ["서울특별시", "서울시"]
    GYEONGGI: ["경기도"]

  # 지역별 목표 좌표 (map 프레임 기준)
  locations:
    SEOUL:
      x: -6.326
      y: 3.209
      yaw: 90.0
    GYEONGGI:
      x: -4.198
      y: 0.200
      yaw: 0.0